spring.application.name=inventepayment2026

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_ID}
spring.mail.password=${MAIL_PASSKEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000


spring.jackson.property-naming-strategy=SNAKE_CASE

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false


spring.datasource.hikari.maximum-pool-size=25
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.saipbuilds.inventepayment2026.model
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.saipbuilds.inventepayment2026.typehandlers

server.port=8080


spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.client-type=lettuce

management.endpoints.web.exposure.include=health,info,prometheus

management.endpoint.health.show-details=never


management.metrics.tags.application=invente_payment
